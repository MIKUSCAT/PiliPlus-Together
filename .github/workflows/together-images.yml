name: Together server images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci && npm test
        working-directory: server
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the deployable image
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} --load \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag piliplus-together-server:1.0.1 server
      - name: Verify the image's health endpoint
        run: |
          docker run -d --name together --platform linux/${{ matrix.arch }} -p 3000:3000 piliplus-together-server:1.0.1
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
          node --input-type=module -e "const r=await fetch('http://127.0.0.1:3000/healthz'); const s=await r.json(); if(!r.ok||s.status!=='ok'||s.protocol!==1) process.exit(1)"
          docker stop together
      - name: Export for deployment without a registry account
        run: |
          mkdir -p artifacts
          docker save piliplus-together-server:1.0.1 | gzip > artifacts/piliplus-together-server-1.0.1-${{ matrix.arch }}.tar.gz
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: together-server-${{ matrix.arch }}
          path: artifacts/*
          compression-level: 0
