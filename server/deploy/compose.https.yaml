services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TOGETHER_DOMAIN: ${TOGETHER_DOMAIN:?Set TOGETHER_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      together:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
