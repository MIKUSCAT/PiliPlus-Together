name: Together checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci && npm test
        working-directory: server

  flutter:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install the project's Flutter version
        shell: pwsh
        run: |
          "PUB_CACHE=$env:RUNNER_TEMP/piliplus-pub-cache" >> $env:GITHUB_ENV
          git -c core.longpaths=true clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/flutter/bin" >> $env:GITHUB_PATH
          & "$env:RUNNER_TEMP/flutter/bin/flutter.bat" config --no-analytics --no-enable-windows-desktop
      - name: Apply the original Android framework patches
        shell: pwsh
        run: ./tool/setup_flutter.ps1 -FlutterRoot "$env:RUNNER_TEMP/flutter" -PubCache $env:PUB_CACHE
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Test synchronization and panel layouts
        shell: pwsh
        run: |
          $env:PILIPLUS_QA_DIR = "$env:GITHUB_WORKSPACE/artifacts/ui"
          $font = "$env:RUNNER_TEMP/NotoSansCJKsc-Regular.otf"
          Invoke-WebRequest https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -OutFile $font
          $env:PILIPLUS_QA_FONT = $font
          flutter test --no-pub test/watch_together --reporter expanded --timeout 60s
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: together-panel-previews
          path: artifacts/ui/*.png
          if-no-files-found: ignore
